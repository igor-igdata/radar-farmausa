name: Radar Alto Custo

on:
  # Quem dispara no horário é o Supabase (sql/disparo_robos.sql): de hora em hora, das 8h
  # às 17h de Brasília, em dia útil, por workflow_dispatch. O agendamento do GitHub atrasa
  # horas e fica só de reserva: o job "horario" (horario.py) só deixa rodar das 8h às 18h
  # e se não houve execução nos últimos 70 minutos.
  schedule:
    - cron: '17,47 11-20 * * 1-5'  # UTC; Brasília = UTC-3
  workflow_dispatch:  # Supabase e disparo manual (rodam sempre)

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  horario:
    # tentativa agendada: roda ou não conforme o horario.py; Supabase e manual rodam sempre
    runs-on: ubuntu-latest
    outputs:
      rodar: ${{ steps.conferir.outputs.rodar }}
    steps:
      - name: Puxar os arquivos do repositório
        if: github.event_name == 'schedule'
        uses: actions/checkout@v4

      - name: Conferir o horário e a última execução
        id: conferir
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
        run: |
          if [ "$EVENTO" != "schedule" ]; then echo "rodar=sim" >> "$GITHUB_OUTPUT"; exit 0; fi
          gh run list -R "$GITHUB_REPOSITORY" -w radar-altocusto.yml -L 30 --json databaseId,status,createdAt,startedAt,updatedAt > execucoes.json
          python3 horario.py execucoes.json

  radar_altocusto:
    needs: horario
    if: needs.horario.outputs.rodar == 'sim'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Instalar o Tesseract (OCR de edital digitalizado)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-por

      - name: Instalar dependências
        run: pip install requests pypdf pymupdf pytesseract

      - name: Executar Radar Alto Custo
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_ALTOCUSTO: ${{ secrets.TELEGRAM_CHAT_ID_ALTOCUSTO }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python LICITACAO_ALTOCUSTO.py
