name: Robô Extrator PNCP FarmaUSA
on:
  # Quem dispara no horário é o Supabase (sql/disparo_robos.sql): de hora em hora, das 8h
  # às 17h de Brasília, em dia útil, por workflow_dispatch. O agendamento do GitHub atrasa
  # horas e fica só de reserva: o job "horario" (horario.py) só deixa rodar das 8h às 18h
  # e se não houve execução nos últimos 70 minutos.
  schedule:
    - cron: '17,47 11-20 * * 1-5'  # UTC; Brasília = UTC-3
  workflow_dispatch: # Supabase e disparo manual (rodam sempre)

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  horario:
    # tentativa agendada: roda ou não conforme o horario.py; Supabase e manual rodam sempre
    runs-on: ubuntu-latest
    outputs:
      rodar: ${{ steps.conferir.outputs.rodar }}
    steps:
      - name: Puxar os arquivos do repositório
        if: github.event_name == 'schedule'
        uses: actions/checkout@v4

      - name: Conferir o horário e a última execução
        id: conferir
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
        run: |
          if [ "$EVENTO" != "schedule" ]; then echo "rodar=sim" >> "$GITHUB_OUTPUT"; exit 0; fi
          gh run list -R "$GITHUB_REPOSITORY" -w automacao.yml -L 30 --json databaseId,status,createdAt,startedAt,updatedAt > execucoes.json
          python3 horario.py execucoes.json

  atualizar_banco:
    needs: horario
    if: needs.horario.outputs.rodar == 'sim'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SUPABASE_URL: ${{ secrets.RADAR_BANCO_URL || secrets.SUPABASE_URL }}  # banco do painel (MySQL) quando o segredo existir
      SUPABASE_KEY: ${{ secrets.RADAR_BANCO_CHAVE || secrets.SUPABASE_KEY }}
    steps:
      - name: Puxar os arquivos do repositório
        uses: actions/checkout@v4

      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar o Tesseract (OCR de edital digitalizado)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-por

      - name: Instalar bibliotecas necessárias
        run: pip install requests pypdf pymupdf pytesseract

      - name: Rodar o Extrator
        run: python LICITACAO.PY

      - name: Notificar falha no Telegram
        if: failure()
        run: |
          HORA_BRASILIA=$(TZ="America/Sao_Paulo" date +'%d/%m/%Y %H:%M')
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="⚠️ <b>Radar FarmaUSA</b>%0AO robô PNCP falhou na execução das ${HORA_BRASILIA} (Brasília).%0A%0AVerifique em: https://github.com/igor-igdata/radar-farmausa/actions" \
            -d parse_mode="HTML"
